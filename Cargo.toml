[package]
name = "bongas-ai"
version = "1.0.0"
edition = "2021"
license = "Proprietary"
description = "Next-generation Ai powered recommendation system"

[dependencies]
# Web Framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "request-id", "util"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid"] }

# Redis
redis = { version = "1.0", features = ["tokio-comp", "connection-manager"] }

# Kafka
rdkafka = { version = "0.39", features = ["cmake-build", "ssl", "gssapi"] }

# ClickHouse
clickhouse = { version = "0.14", features = ["time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"
lru = "0.12"
rkyv = { version = "0.7", features = ["validation"] }
bytecheck = "0.6"

# ONNX Runtime
ort = { version = "2.0.0-rc.11", features = ["ndarray"] }
ndarray = "0.17"

# Security & Crypto
sha2 = "0.10"
hex = "0.4"
jsonwebtoken = "9"
bcrypt = "0.15"

# Async & Concurrency
async-trait = "0.1"
futures = "0.3"
arc-swap = "1.7"
async-recursion = "1.1"
async-compression = { version = "0.4", features = ["tokio", "zstd"] }

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"

# OpenTelemetry
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-client"] }
opentelemetry-http = "0.27"
tracing-opentelemetry = "0.28"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# Time & Dates
chrono = { version = "0.4", features = ["serde"] }


# Misc
uuid = { version = "1", features = ["v4", "serde"] }
url = "2.5"
lazy_static = "1.4"
dashmap = "6"
rand = "0.8"

# HTTP Client (for Spring Cloud Config)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "stream"] }

# Additional dependencies for middleware
bytes = "1.0"
hyper = "1.0"
httpdate = "1.0"

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "redis_bench"
harness = false

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "engine_bench"
harness = false

[[bench]]
name = "thunder_killer_bench"
harness = false

[[bench]]
name = "logic_bench"
harness = false

[[bench]]
name = "cache_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
