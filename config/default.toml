[server]
host = "0.0.0.0"
port = 8080
environment = "development"

[database]
url = "postgresql://postgres:password@localhost:5432/baze_catalog"
max_connections = 100

[redis]
url = "redis://localhost:6379"
pool_size = 50

[clickhouse]
url = "localhost:8123/baze_reports?socket_timeout=60000&connection_timeout=30000&max_execution_time=60&retry_on_failure=2&failover=3"
user = "default"
password = "default"
database = "baze_reports"

[kafka]
enabled = false
brokers = "localhost:9092"
group_id = "bongas-ai-consumers"
profile_topic = "profile.events"
reaction_topic = "reaction.events"
notification_topic = "notification.events"
playback_topic = "playback.events"

[security]
license_key = ""
license_server_url = "https://license.example.com"
hardware_id_salt = ""
mobile_api_key = "example.AQCgwMoKSL74XErUhGRRcEPmpHUgNjOi"
web_api_key = "example.AQB6yIpbUufNPdoXj5ZTHtuSBC+Gr9m6Rx6"
tv_api_key = "example.AQBc6/fsiuXinBvMRLlY9UV1dcouxgQCSLt5"
system_api_key = "example.AQC5DashChLVmDh2a4aEOE5y9b2BxuQU"
jwt_secret_key = "example.AQAnudV+IfZzOHjN2tBJ3FCyoEXxOnIZ"

[spring_cloud]
enabled = false
url = "http://localhost:8888"
app_name = "bongas-ai"
profile = "production"

[ml]
model_path = "./models"
batch_size = 32

[onnx]
enabled = true
model_path = "./models"
execution_provider = "cpu"
graph_optimization = true

[cache]
l1_ttl_seconds = 300
l2_ttl_seconds = 3600
warming_interval_minutes = 30
warm_scenarios = [
    "personalized_home",
    "continue_watching",
    "trending_now",
    "live_tv"
]

[logging]
level = "info"

[experiments]
enabled = false
assignment_method = "random"
