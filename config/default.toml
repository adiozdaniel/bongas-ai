[server]
host = "0.0.0.0"
port = 8080
environment = "development"

[database]
url = ""
max_connections = 100

[redis]
url = ""
pool_size = 50

[clickhouse]
url = ""
user = ""
password = ""
database = ""

[kafka]
enabled = false
brokers = ""
group_id = "bongas-ai-consumers"
profile_topic = "profile.events"
reaction_topic = "reaction.events"
notification_topic = "notification.events"
playback_topic = "playback.events"

[security]
license_key = ""
license_server_url = ""
hardware_id_salt = ""
mobile_api_key = ""
web_api_key = ""
tv_api_key = ""
system_api_key = ""
jwt_secret_key = ""

[spring_cloud]
enabled = false
url = ""
app_name = "bongas-ai"
profile = "production"

[ml]
model_path = "./models"
batch_size = 32

[candle]
enabled = true
model_path = "./models"

[cache]
l1_ttl_seconds = 300
l2_ttl_seconds = 3600
warming_interval_minutes = 30
warm_scenarios = [
    "personalized_home",
    "continue_watching",
    "trending_now",
    "live_tv"
]

[logging]
level = "info"

[experiments]
enabled = false
assignment_method = "random"

[search]
enabled = true
index_path = "data/search_index"
writer_memory_mb = 50
index_name = "items"
timeout_ms = 500
max_hits = 100
typo_tolerance = true
