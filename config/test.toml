# Test Configuration for BONGAS-AI

[server]
host = "127.0.0.1"
port = 8081
environment = "test"

[database]
url = "postgresql://postgres:password@localhost:5433/bongas_ai_test"
max_connections = 10
connection_timeout = 30

[redis]
url = "redis://localhost:6380"
pool_size = 20
connection_timeout = 5
request_timeout = 10

[clickhouse]
url = "http://localhost:8124"
connection_timeout = 10
request_timeout = 30

[kafka]
enabled = false
brokers = "localhost:9093"
group_id = "bongas_ai_test"

[cache]
l1_enabled = true
l2_enabled = false
l1_ttl = 300
l2_ttl = 3600

[ml]
model_path = "models"
batch_size = 32
onnx_intra_threads = 1

[pipeline]
stage_breaker_enabled = false
pipeline_timeout = 30

[security]
license_key = "test-license-key"
anti_debug_enabled = false

[logging]
level = "debug"

[experiments]
enabled = false
