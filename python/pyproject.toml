[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bongas-ml"
version = "1.0.0"
description = "Machine learning models for BONGAS-AI (training only, not shipped)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.35.0",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "pyarrow>=15.0.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
]
